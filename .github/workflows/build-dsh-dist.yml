name: Build DSH plugin artifacts

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dsh/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - ".github/workflows/build-dsh-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dsh-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI bundle
        run: pnpm build

      - name: Verify DSH entry exists
        run: test -s dist/main.js

      - name: Commit generated DSH artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/main.js
          if git diff --cached --quiet; then
            echo "dist/main.js is already up to date"
          else
            git commit -m "build: update DSH CLI artifact [skip ci]"
            git push
          fi

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModSearch 网络流量监控</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#080b12;color:#e8eef9;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px}.muted{color:#8c9ab1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#111827;border:1px solid #253149;border-radius:14px;padding:18px;margin-top:14px}.value{font-size:26px;font-weight:700;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:11px;border-bottom:1px solid #253149}.ok{color:#46dc91}.bad{color:#ff7474}.chart{height:220px}.chart svg{width:100%;height:100%}.note{color:#91a0b8;font-size:12px}@media(max-width:760px){body{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><header><div><h1>◉ ModSearch · 网络流量监控</h1><div class="muted">实时 API 数据传输与历史记录</div></div><span id="live">● 正在连接</span></header><section class="grid"><div class="card"><div class="muted">累计上传</div><div class="value" id="up">—</div></div><div class="card"><div class="muted">累计下载</div><div class="value" id="down">—</div></div><div class="card"><div class="muted">API 请求次数</div><div class="value" id="calls">—</div></div><div class="card"><div class="muted">成功率</div><div class="value" id="rate">—</div></div></section><section class="card"><b>最近 30 次请求 · 下载字节</b><div class="chart"><svg id="chart" viewBox="0 0 900 220"></svg></div></section><section class="card"><b>引擎流量明细</b><table><thead><tr><th>API / 引擎</th><th>请求数</th><th>上传</th><th>下载</th><th>成功率</th></tr></thead><tbody id="engines"></tbody></table></section><section class="card"><b>最近请求记录</b><table><thead><tr><th>时间</th><th>引擎</th><th>上传</th><th>下载</th><th>HTTP</th><th>结果</th></tr></thead><tbody id="recent"></tbody></table></section><p class="note">统计口径：应用层请求/响应 payload 字节数，不含 TCP/TLS/HTTP 协议头。独立外部进程系统级网络流量需额外采集，不能以进程输出字节数代替。</p></main><script>const $=id=>document.getElementById(id),fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){try{const r=await fetch('/modsearch/traffic?data=1',{cache:'no-store'});if(!r.ok)throw Error(r.status);const a=(await r.json()).entries||[],up=a.reduce((s,x)=>s+x.uploadBytes,0),down=a.reduce((s,x)=>s+x.downloadBytes,0),ok=a.filter(x=>x.ok).length;$('up').textContent=fmt(up);$('down').textContent=fmt(down);$('calls').textContent=a.length;$('rate').textContent=(a.length?ok/a.length*100:0).toFixed(1)+'%';$('live').textContent='● 实时更新 · '+new Date().toLocaleTimeString();const g={};for(const x of a){const v=g[x.engine]??(g[x.engine]={n:0,u:0,d:0,ok:0});v.n++;v.u+=x.uploadBytes;v.d+=x.downloadBytes;if(x.ok)v.ok++}$('engines').innerHTML=Object.entries(g).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.n+'</td><td>'+fmt(v.u)+'</td><td>'+fmt(v.d)+'</td><td>'+(v.ok/v.n*100).toFixed(1)+'%</td></tr>').join('')||'<tr><td colspan="5">暂无数据</td></tr>';$('recent').innerHTML=a.slice(-20).reverse().map(x=>'<tr><td>'+new Date(x.at).toLocaleString()+'</td><td>'+esc(x.engine)+'</td><td>'+fmt(x.uploadBytes)+'</td><td>'+fmt(x.downloadBytes)+'</td><td>'+(x.status??'—')+'</td><td class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'成功':'失败')+'</td></tr>').join('')||'<tr><td colspan="6">暂无记录</td></tr>';const v=a.slice(-30).map(x=>x.downloadBytes),m=Math.max(1,...v),p=v.map((n,i)=>(v.length<2?450:i*900/(v.length-1))+','+(205-n/m*185)).join(' ');$('chart').innerHTML='<polyline points="'+p+'" fill="none" stroke="#27d98b" stroke-width="3"/>'}catch(e){$('live').textContent='● 连接失败 · '+e.message}}refresh();setInterval(refresh,2000);</script></body></html>
